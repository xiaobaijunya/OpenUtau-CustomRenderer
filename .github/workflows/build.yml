on:
  schedule:
    # Daily alpha build. Skipped if master has no new commits since the
    # last alpha release (see the next-version job below).
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        default: alpha
        options:
          - stable
          - beta
          - alpha
      version:
        description: "Version (required for stable/beta, ignored for alpha)"
        default: ""
        required: false
        type: string
      release:
        type: boolean
        default: false
        description: "Release"
      draft:
        type: boolean
        default: true
        description: "Draft"

# Keep same-trigger-type runs from overlapping, e.g. a slow scheduled build
# still running when the next day's cron fires.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  next-version:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.nv.outputs.channel }}
      version: ${{ steps.nv.outputs.version }}
      tag: ${{ steps.nv.outputs.tag }}
      name: ${{ steps.nv.outputs.name }}
      release: ${{ steps.nv.outputs.release }}
      draft: ${{ steps.nv.outputs.draft }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        # Scheduled runs skip the build entirely when master hasn't moved
        # since the last alpha release, so a quiet day publishes nothing.
        if: github.event_name == 'schedule'
        run: |
          latest_tag=$(git tag --list '*-alpha' | sort -V | tail -1)
          if [ -z "$latest_tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            last_sha=$(git rev-list -n 1 "$latest_tag")
            head_sha=$(git rev-parse HEAD)
            if [ "$last_sha" = "$head_sha" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - id: nv
        if: steps.check.outputs.skip != 'true'
        env:
          # Scheduled runs always build and publish an alpha release.
          EVENT: ${{ github.event_name }}
          CHANNEL: ${{ github.event_name == 'schedule' && 'alpha' || inputs.channel }}
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ github.event_name == 'schedule' && 'true' || inputs.release }}
          DRAFT: ${{ github.event_name == 'schedule' && 'false' || inputs.draft }}
        run: |
          set -u
          # Alpha is the only auto-versioned channel; stable and beta take
          # the version from the dispatch input.
          if [ "$CHANNEL" = alpha ]; then
            git ls-remote --tags origin > tags.txt
            version=$(python .github/scripts/next-version.py < tags.txt)
            tag="$version-alpha"
            name="$version Alpha"
          else
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'; then
              echo "::error::version must be X.Y.Z for the $CHANNEL channel (got '$VERSION')"
              exit 1
            fi
            version="$VERSION"
            if [ "$CHANNEL" = beta ]; then
              tag="$version-beta"
              name="$version Beta"
            else
              tag="$version"
              name="$version"
            fi
          fi
          {
            echo "channel=$CHANNEL"
            echo "version=$version"
            echo "tag=$tag"
            echo "name=$name"
            echo "release=$RELEASE"
            echo "draft=$DRAFT"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
  build:
    needs: next-version
    if: needs.next-version.outputs.skip != 'true'
    runs-on: ${{ matrix.arch.runs-on }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: win-x64, rid: win-x64, arch: x64, os: win, runs-on: windows-latest }
          - { name: win-arm64, rid: win-arm64, arch: arm64, os: win, runs-on: windows-latest }
          - { name: osx-arm64, rid: osx-arm64, arch: arm64, os: osx, runs-on: macos-latest }
          - { name: linux-x64, rid: linux-x64, arch: x64, os: linux, runs-on: ubuntu-latest, linuxarch: x86_64}

    steps:
      # Setup
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: justalemon/VersionPatcher@v0.7.1
        with:
          version: ${{ needs.next-version.outputs.version }}
          csproj-files: "OpenUtau/*.csproj"

      # Test
      - name: Test
        run: dotnet run --project OpenUtau.Test/OpenUtau.Test.csproj
        timeout-minutes: 30

      # Build
      - name: Restore
        run: dotnet restore OpenUtau -r ${{ matrix.arch.rid }}

      - name: Build (Windows and Linux)
        run: dotnet publish OpenUtau -c Release -r ${{ matrix.arch.rid }} --self-contained true -o bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os != 'osx' }}

      - name: Build (MacOS)
        run: dotnet msbuild OpenUtau -t:BundleApp -p:Configuration=Release -p:RuntimeIdentifier=${{ matrix.arch.rid }} -p:UseAppHost=true -p:SelfContained=true -p:OutputPath=../bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os == 'osx' }}

      - name: Add Liquid Glass icon (macOS)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          chmod +x .github/scripts/add-liquid-glass-icon.sh
          .github/scripts/add-liquid-glass-icon.sh \
            bin/${{ matrix.arch.name }}/publish/OpenUtau.app \
            OpenUtau/Assets/OpenUtau.icon \
            OpenUtau
        if: ${{ matrix.arch.os == 'osx' }}

      # The macOS runner is a plugin execution provider: without its library in the
      # bundle the app silently falls back to CPU, so fail the build here instead.
      - name: Verify WebGPU execution provider is bundled (macOS)
        run: |
          app="bin/${{ matrix.arch.name }}/publish/OpenUtau.app"
          lib=$(find "$app" -name 'libonnxruntime_providers_webgpu.dylib' -print -quit)
          if [ -z "$lib" ]; then
            echo "::error::libonnxruntime_providers_webgpu.dylib is missing from $app"
            find "$app" -name '*onnxruntime*' -print
            exit 1
          fi
          echo "WebGPU plugin library: $lib"
        if: ${{ matrix.arch.os == 'osx' }}

      - name: Write release channel info
        run: "@{Channel='${{ needs.next-version.outputs.channel }}'} | ConvertTo-Json > bin/${{ matrix.arch.name }}/prefs-default.json"
        shell: pwsh

      # Create Zip
      - name: DirectML
        shell: cmd
        run: |
          curl -L https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4 -o Microsoft.AI.DirectML.nupkg
          mkdir Microsoft.AI.DirectML
          tar -xf Microsoft.AI.DirectML.nupkg -C Microsoft.AI.DirectML
          copy /y Microsoft.AI.DirectML\bin\${{ matrix.arch.arch }}-${{ matrix.arch.os }}\DirectML.dll bin\${{ matrix.arch.name }}\
        if: ${{ matrix.arch.os == 'win' }}

      - name: Set executable permission
        run: chmod +x bin/${{ matrix.arch.name }}/OpenUtau
        if: ${{ matrix.arch.os == 'linux' }}

      # Download default voicebank
      - name: Download default voicebank (XiaoShuang)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/${{ matrix.arch.name }}/Singers
          curl -L https://github.com/xiaobaijunya/OpenUtau-CustomRenderer/releases/download/0.0.0/XiaoShuang_zhcvv.zip -o XiaoShuang_zhcvv.zip
          Expand-Archive -Path XiaoShuang_zhcvv.zip -DestinationPath bin/${{ matrix.arch.name }}/Singers/ -Force
          Remove-Item XiaoShuang_zhcvv.zip

      # Upload Artifacts (non-release only, GitHub will zip the directory once)
      - uses: actions/upload-artifact@v4
        with:
          name: OpenUtau-${{ matrix.arch.name }}
          path: bin/${{ matrix.arch.name }}/
        if: ${{ needs.next-version.outputs.release != 'true' }}

      # Appcast
      # Windows 上用 cmd：PowerShell 会把 -v=0.0.11 这类参数拆开传给 python。
      - name: Appcast
        shell: cmd
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=windows -r=${{ matrix.arch.name }} -f=OpenUtau-${{ matrix.arch.name }}.zip
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'win' }}

      - name: Appcast macOS
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=macos -r=${{ matrix.arch.name }} -f=OpenUtau-${{ matrix.arch.name }}.zip
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'osx' }}

      - name: Appcast Linux
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=linux -r=${{ matrix.arch.name }} -f=OpenUtau-${{ matrix.arch.name }}.zip
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'linux' }}

      # Create Zip for Release
      - name: Create Zip (Windows)
        run: |
          cd bin/${{ matrix.arch.name }}
          7z a ../../OpenUtau-${{ matrix.arch.name }}.zip *
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'win' }}

      - name: Create Zip (Linux/macOS)
        run: |
          cd bin/${{ matrix.arch.name }}
          zip -r ../../OpenUtau-${{ matrix.arch.name }}.zip *
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os != 'win' }}

      # Generate release changelog
      - name: Generate release changelog
        shell: pwsh
        run: |
          $currentVersion = "${{ needs.next-version.outputs.version }}"
          $repo = "stakira/OpenUtau"

          # Find previous version tag
          $tags = git tag --list | Where-Object { $_ -match '^\d+\.\d+\.\d+$' } | Sort-Object -Descending
          $prevTag = $null
          foreach ($tag in $tags) {
            if ([version]$tag -lt [version]$currentVersion) {
              $prevTag = $tag
              break
            }
          }

          $bodyLines = [System.Collections.ArrayList]::new()

          if ($prevTag) {
            $log = git log "$($prevTag)..HEAD" --oneline --no-merges
            Write-Host "Found previous tag: $prevTag, commits count: $($log.Count)"
            [void]$bodyLines.Add("## 更新内容")
            [void]$bodyLines.Add("基于上个版本 \`$prevTag\` 的更新：")
            [void]$bodyLines.Add("")
            $i = 1
            foreach ($line in $log) {
              $parts = $line.Split(' ', 2)
              $hash = $parts[0]
              $msg = $parts[1]
              [void]$bodyLines.Add("$i. [$msg](https://github.com/$repo/commit/$hash)")
              $i++
            }
            [void]$bodyLines.Add("")
          }

          [void]$bodyLines.Add("See [Getting Started](https://github.com/$repo/wiki/Getting-Started) for how to use.")
          [void]$bodyLines.Add("")
          [void]$bodyLines.Add("If you encountered issues, see [FAQ](https://github.com/$repo/wiki/FAQ)")
          [void]$bodyLines.Add("")
          [void]$bodyLines.Add("## macOS says `"This app is damaged`"")
          [void]$bodyLines.Add("Open a terminal and run `xattr -rc /Applications/OpenUtau.app`. Try opening OpenUtau again.")

          $bodyLines -join "`n" | Out-File -FilePath release_body.md -Encoding utf8
          Write-Host "Release body written to release_body.md"

      # Release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.next-version.outputs.tag }}
          name: ${{ needs.next-version.outputs.name }}
          prerelease: ${{ needs.next-version.outputs.channel != 'stable' }}
          draft: ${{ needs.next-version.outputs.draft == 'true' }}
          body_path: release_body.md
          files: |
            appcast.${{ matrix.arch.name }}*.xml
            OpenUtau-${{ matrix.arch.name }}.zip
        if: ${{ needs.next-version.outputs.release == 'true' }}
